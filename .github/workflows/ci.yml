# The consumer canary: the smallest real use of master-ci from a foreign
# repository, mirroring examples/ci.yml in the template. Both the reusable
# workflow ref and template_ref are pinned to an exact release tag so the
# tested baseline is reproducible; the watchdog in master-ci reports how far
# the pin lags the newest release.
name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 5 * * *" # daily 05:20 UTC, watched by master-ci's integration.yml
  workflow_dispatch:

# Least privilege, zizmor-proof: minimal at the workflow level, the
# elevated scopes on exactly the jobs that need them (mirroring
# examples/ci.yml). A workflow-level write next to any job-level block
# trips the excessive-permissions audit.
permissions:
  contents: read

jobs:
  master:
    uses: WasewaseX/master-ci/.github/workflows/master-ci.yml@v2.7.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # only for Scorecard publishing inside the template
    with:
      template_repo: WasewaseX/master-ci
      # a foreign consumer pins the helper ref: master-ci v1.8.6 proved
      # github.workflow_sha is the caller's commit for cross-repo calls,
      # so an empty template_ref fails closed with pin instructions
      template_ref: v2.7.1
      # v2.2.0: the quality-ratchet release. The committed
      # .quality-baseline.json is the floor: zero findings in every
      # check across all ten stacks, so any future finding of any kind
      # blocks the run until it is fixed or a reviewed commit re-records
      # the floor. The new-code gate stays armed (diff_base): the lines
      # each change adds need blocking-score 0, cognitive 15 and
      # cyclomatic 15. coverage_min 30 gates the uploaded reports; a
      # floor without a report fails closed.
      #
      # v2.3.0: the flake-hunt release. flaky.yml joins this workflow as
      # a second scheduled consumer call (Mondays 04:00 UTC): it runs
      # the pytest suite three times, and tests/test_flake_demo.py
      # fails exactly on odd iterations, so the hunt sees pass/fail/pass
      # and the committed .flaky-baseline.json quarantines it - proving
      # parser, classifier and grandfathering end to end on real
      # runners. A second, unlisted flaky test would fail the hunt.
      #
      # v2.4.0: the quarantine loop. The hunt's copy gains the verdict
      # output and the proposal step; when the hunt ever fails on a new
      # flake in enforcement mode (the baseline is committed), the new
      # quarantine job re-verifies the candidate against the default
      # branch and opens/updates the ci/flake-quarantine PR - bounded by
      # add-paths to .flaky-baseline.json, append-only, never a push to
      # main. The demo flake stays quarantined, so routine runs see
      # status quarantined-only: no proposal, no PR.
      #
      # v2.4.1: hygiene repair. The two adhoc-packages suppressions in
      # the hunt's copy sat inside run: | block scalars - shell text,
      # invisible to zizmor - so the hygiene gate failed on every
      # exercise since the hunt shipped. They now sit on the key lines,
      # and the template's own contract test rejects the buried form.
      # v2.4.2: the rest of the gate chain finally ran against the
      # hunt code - ruff format and editorconfig fixes rode along.
      coverage_min: 30
      diff_base: origin/main

  # v2.7.0: the semantic eye. codeql.yml is the template's second
  # reusable workflow - free on public repos, deep data-flow security
  # analysis, SARIF to the Security tab with a per-language category.
  # Its default is languages: auto (a template-provided detector reads
  # the committed manifests), but this canary is deliberately polyglot:
  # auto would fan out to eight autobuild jobs per push. A real
  # consumer with two manifests gets auto for free; the canary pins one
  # dialect and the faster security-extended suite, exercising the
  # explicit-languages path instead. The dashboard's Semantic analysis
  # row flips to 'armed via own workflow' either way - it is verified
  # by grepping THIS file for the codeql.yml call below, not declared.
  codeql:
    uses: WasewaseX/master-ci/.github/workflows/codeql.yml@v2.7.1
    with:
      languages: python
      queries: security-extended
    permissions:
      contents: read
      security-events: write
