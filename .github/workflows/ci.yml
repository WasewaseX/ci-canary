# The consumer canary: the smallest real use of master-ci from a foreign
# repository, mirroring examples/ci.yml in the template. Both the reusable
# workflow ref and template_ref are pinned to an exact release tag so the
# tested baseline is reproducible; the watchdog in master-ci reports how far
# the pin lags the newest release.
name: CI

on:
  push:
    branches: [main]
  pull_request: # exercise the dashboard: it renders only on PR events
  schedule:
    - cron: "20 5 * * *" # daily 05:20 UTC, watched by master-ci's integration.yml
  workflow_dispatch:

# Least privilege, zizmor-proof: minimal at the workflow level, the
# elevated scopes on exactly the jobs that need them (mirroring
# examples/ci.yml). A workflow-level write next to any job-level block
# trips the excessive-permissions audit.
permissions:
  contents: read

jobs:
  # v2.8.0: the unblindable gate. required-quality.yml is the template's
  # third reusable workflow - the caller-level aggregate the audit
  # demanded: it calls master-ci.yml AND codeql.yml itself, and its gate
  # job is the one check branch protection should require. A red or
  # skipped CodeQL analysis now blocks the merge exactly like a failed
  # quality gate; before v2.8.0, requiring ci-success alone could never
  # see CodeQL at all. The canary keeps its own settings (coverage_min,
  # diff_base, the explicit python dialect) - every master-ci input is
  # forwarded 1:1, plus the CodeQL inputs, so the aggregate loses
  # nothing. The dashboard's Semantic analysis row flips to 'armed via
  # required-quality aggregate' - verified by grepping THIS file for the
  # required-quality.yml call, not declared.
  required:
    uses: WasewaseX/master-ci/.github/workflows/required-quality.yml@v2.15.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # only for Scorecard publishing inside the template
    with:
      template_repo: WasewaseX/master-ci
      # a foreign consumer pins the helper ref: master-ci v1.8.6 proved
      # github.workflow_sha is the caller's commit for cross-repo calls,
      # so an empty template_ref fails closed with pin instructions
      template_ref: v2.15.0
      # The committed .quality-baseline.json is the floor: zero findings
      # in every check across all ten stacks. The new-code gate stays
      # armed (diff_base): the lines each change adds need blocking-score
      # 0, cognitive 15 and cyclomatic 15, and since v2.8.0 the gate
      # reports the analysis state of every changed file - a parse
      # failure is exit 2, never a silent pass. coverage_min 30 gates
      # the uploaded reports; a floor without a report fails closed.
      coverage_min: 30
      diff_base: origin/main
      languages: python
      queries: security-extended
