# The consumer canary: the smallest real use of master-ci from a foreign
# repository, mirroring examples/ci.yml in the template. Both the reusable
# workflow ref and template_ref are pinned to an exact release tag so the
# tested baseline is reproducible; the watchdog in master-ci reports how far
# the pin lags the newest release.
name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 5 * * *" # daily 05:20 UTC, watched by master-ci's integration.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  id-token: write

jobs:
  master:
    uses: WasewaseX/master-ci/.github/workflows/master-ci.yml@v2.2.0
    with:
      template_repo: WasewaseX/master-ci
      # a foreign consumer pins the helper ref: master-ci v1.8.6 proved
      # github.workflow_sha is the caller's commit for cross-repo calls,
      # so an empty template_ref fails closed with pin instructions
      template_ref: v2.2.0
      # v2.2.0: the quality-ratchet release. The committed
      # .quality-baseline.json is the floor: zero findings in every
      # check across all ten stacks, so any future finding of any kind
      # blocks the run until it is fixed or a reviewed commit re-records
      # the floor. The new-code gate stays armed (diff_base): the lines
      # each change adds need blocking-score 0, cognitive 15 and
      # cyclomatic 15. coverage_min 30 gates the uploaded reports; a
      # floor without a report fails closed.
      coverage_min: 30
      diff_base: origin/main
