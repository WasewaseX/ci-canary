# The consumer canary: the smallest real use of master-ci from a foreign
# repository, mirroring examples/ci.yml in the template. Both the reusable
# workflow ref and template_ref are pinned to an exact release tag so the
# tested baseline is reproducible; the watchdog in master-ci reports how far
# the pin lags the newest release.
name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 5 * * *" # daily 05:20 UTC, watched by master-ci's integration.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  id-token: write

jobs:
  master:
    uses: WasewaseX/master-ci/.github/workflows/master-ci.yml@v2.1.0
    with:
      template_repo: WasewaseX/master-ci
      # a foreign consumer pins the helper ref: master-ci v1.8.6 proved
      # github.workflow_sha is the caller's commit for cross-repo calls,
      # so an empty template_ref fails closed with pin instructions
      template_ref: v2.1.0
      # v2.1.0: the native-dependency release. Unused-dependency oracles
      # now cover Go, Rust, PHP, C# and Java, and the orphan-module check
      # walks every module - the canary's ten stacks are the proof that a
      # real multi-stack tree scans clean (zero findings, grade A).
      # coverage_min 30 gates the uploaded reports, and diff_base turns
      # on the new-code gate: the lines each change adds need
      # blocking-score 0, cognitive 15 and cyclomatic 15. A floor without
      # a report fails closed. The import-cycle scan runs repo-wide on
      # every push - the canary's ten stacks are its graph.
      coverage_min: 30
      diff_base: origin/main
