# =============================================================================
# Flaky Test Hunt - the canary's scheduled proof, called from the template
# =============================================================================
# v2.10.0 exercise: flaky.yml completes the template's reusable trilogy -
# the last copy-whole surface becomes one pinned uses: line. The 472-line
# copy this repository carried since the v2.3 exercise is deleted; the
# caller owns the schedule trigger (a called workflow cannot carry one).
#
# The write scopes on the calling job are unconditional and this run
# proved it: the first dispatch (read-only wrapper) died as a
# startup_failure with zero jobs, because the called workflow's
# quarantine job declares contents: write and pull-requests: write and a
# reusable call that grants less never starts. The scopes let the run
# START; the committed .flaky-baseline.json decides whether the loop
# ever FIRES - the demo flake stays quarantined, so routine hunts report
# quarantined-only: no proposal, no PR, no write happens. zizmor stays
# quiet: the scopes sit on exactly one job, never at the workflow level.
#
# template_ref is pinned to the exact release like every other canary
# call; template_repo is explicit because a cross-repo call cannot
# auto-detect the helper repo (GITHUB_WORKFLOW_REF names the caller's
# workflow there - the codeql.yml contract, v1.8.6 lesson).
# =============================================================================

name: Flaky Test Hunt

on:
  schedule:
    - cron: "20 4 * * 1" # Mondays 04:20 UTC - between the template's own hunt and the mutation wrapper
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    # The scopes the called quarantine job declares must be granted HERE,
    # on the calling job, or GitHub rejects the call before any job runs.
    permissions:
      contents: write
      pull-requests: write
    uses: WasewaseX/master-ci/.github/workflows/flaky.yml@v2.16.0
    with:
      template_repo: WasewaseX/master-ci
      template_ref: v2.16.0
