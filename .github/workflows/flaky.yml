# =============================================================================
# Flaky Test Hunt - the canary's scheduled proof, called from the template
# =============================================================================
# v2.10.0 exercise: flaky.yml completes the template's reusable trilogy -
# the last copy-whole surface becomes one pinned uses: line. The 472-line
# copy this repository carried since the v2.3 exercise is deleted; the
# caller owns the schedule trigger (a called workflow cannot carry one)
# and the quarantine loop's write scopes. This wrapper stays read-only on
# purpose: the committed .flaky-baseline.json arms enforcement (the demo
# flake stays quarantined, so routine hunts report quarantined-only, no
# proposal, no PR), and write scopes are only needed when a NEW flaky
# test should open the ci/flake-quarantine PR. The hunt itself and the
# quarantine's verify path never need write access - a wrapper that
# grants nothing adopts the hunt with the exact semantics the template
# documents, and zizmor keeps its clean report.
#
# template_ref is pinned to the exact release like every other canary
# call; template_repo is explicit because a cross-repo call cannot
# auto-detect the helper repo (GITHUB_WORKFLOW_REF names the caller's
# workflow there - the codeql.yml contract, v1.8.6 lesson).
# =============================================================================

name: Flaky Test Hunt

on:
  schedule:
    - cron: "20 4 * * 1" # Mondays 04:20 UTC - between the template's own hunt and the mutation wrapper
  workflow_dispatch:

# Least privilege: the hunt runs this repository's test suite and reads
# nothing but the committed baseline. Nothing writes.
permissions:
  contents: read

jobs:
  hunt:
    uses: WasewaseX/master-ci/.github/workflows/flaky.yml@v2.10.0
    with:
      template_repo: WasewaseX/master-ci
      template_ref: v2.10.0
