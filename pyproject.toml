[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-canary"
version = "0.1.0"
description = "Independent consumer canary for WasewaseX/master-ci"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
