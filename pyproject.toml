[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-canary"
version = "0.1.0"
description = "Independent consumer canary for WasewaseX/master-ci"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["canary"]

# PEP 735: declare the test dependency so imports in tests/ are resolvable
# to the manifest (the integrity engine's undeclared-import check reads this).
[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# v2.9.0 exercise: the mutation-test opt-in, by declaration. The
# template's mutation.yml greps for exactly this section; paths are
# scoped to the pure reference module so every surviving mutant is an
# honest assertion gap in covered code, not noise from an entry script.
[tool.mutmut]
source_paths = ["canary.py"]
pytest_add_cli_args_test_selection = ["tests"]
